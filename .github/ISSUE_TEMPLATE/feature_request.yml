name: "Funktionswunsch"
description: "Schlage eine neue Funktion oder Verbesserung für COOL-Grades vor."
title: "[Wunsch]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Beschreibe den Wunsch bitte aus Sicht der Lehrkraft oder Administration: Welches Problem soll gelöst werden?

  - type: textarea
    id: problem
    attributes:
      label: "Welches Problem soll gelöst werden?"
      description: "Beschreibe die Situation im Schulalltag oder in der Verwaltung."
      placeholder: "Als Lehrkraft möchte ich ..., weil ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: "Gewünschte Lösung"
      description: "Wie sollte sich COOL-Grades aus deiner Sicht verhalten?"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: "Betroffener Bereich"
      options:
        - "Mitarbeit erfassen"
        - "Besondere Leistungsfeststellungen"
        - "Auswertung / PDF"
        - "Abschlussbeurteilung"
        - "Schuljahreswechsel"
        - "Administration"
        - "Benutzeroberfläche / Bedienbarkeit"
        - "Dokumentation"
        - "Sonstiges"
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: "Dringlichkeit aus deiner Sicht"
      options:
        - "niedrig"
        - "mittel"
        - "hoch"
        - "unklar"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Mögliche Alternativen"
      description: "Gibt es eine einfachere Lösung oder einen Workaround?"

  - type: checkboxes
    id: privacy
    attributes:
      label: "Datenschutz"
      options:
        - label: "Ich habe keine echten Schüler:innen-, Noten-, Passwort- oder Zugangsdaten eingefügt."
          required: true
