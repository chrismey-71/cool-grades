<!doctype html>
<html lang="de-AT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Handbuch | COOL-Grades</title>
  <meta name="description" content="Lehrer:innen-Handbuch und Dokumentation zu COOL-Grades, formatiert zum Lesen im Browser.">
  <meta name="robots" content="index,follow">
  <style>
    /* Gleiche Farbwelt wie index.html: ruhiges Grün, helle Flächen. Layout: Inhaltsverzeichnis links (sticky), Text rechts. */
    :root {
      --text: #1f2933;
      --muted: #5f6c76;
      --quiet: #7a8791;
      --background: #f7f8f6;
      --surface: #ffffff;
      --surface-soft: #f0f4f1;
      --line: #d9dfd9;
      --line-strong: #bdc8bf;
      --accent: #2f5f4a;
      --accent-soft: #e3eee8;
      --note: #8a6d2f;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 92px; }
    body {
      margin: 0;
      color: var(--text);
      background: var(--background);
      font-family: "Aptos", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.6;
    }
    a { color: var(--accent); text-underline-offset: 3px; }
    a:hover { color: #173c2c; }
    .page { width: min(1180px, calc(100% - 32px)); margin: 0 auto; }

    .topbar {
      position: sticky; top: 0; z-index: 10;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .95);
      backdrop-filter: blur(6px);
    }
    .bar { display: flex; align-items: center; gap: 14px; min-height: 60px; flex-wrap: wrap; padding: 8px 0; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; color: var(--text); text-decoration: none; }
    .brand-mark {
      display: grid; place-items: center; width: 32px; height: 32px; border-radius: 7px;
      background: var(--accent); color: #fff; font-size: .78rem; letter-spacing: .04em;
    }
    .doc-switch { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
    .doc-switch a {
      padding: 5px 11px; border: 1px solid var(--line); border-radius: 999px;
      background: var(--surface); color: var(--muted); font-size: .88rem; text-decoration: none;
    }
    .doc-switch a[aria-current="page"] { border-color: var(--accent); background: var(--accent); color: #fff; }

    .layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 32px; padding: 24px 0 48px; align-items: start; }
    .toc {
      position: sticky; top: 76px; max-height: calc(100vh - 92px); overflow: auto;
      padding: 14px 14px 14px 0; font-size: .9rem;
    }
    .toc h2 { margin: 0 0 8px; font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; color: var(--quiet); }
    .toc ol { list-style: none; margin: 0; padding: 0; }
    .toc li { margin: 0; }
    .toc a { display: block; padding: 3px 8px; border-left: 2px solid transparent; color: var(--muted); text-decoration: none; line-height: 1.35; }
    .toc a:hover { color: var(--accent); }
    .toc a.is-active { border-left-color: var(--accent); color: var(--accent); font-weight: 600; }
    .toc .lvl3 a { padding-left: 20px; font-size: .86rem; }
    .toc-mobile { display: none; }

    .doc-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; font-size: .9rem; }
    .doc-actions a {
      padding: 6px 12px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); text-decoration: none;
    }

    article.doc {
      min-width: 0; max-width: 820px;
      padding: 28px 36px 40px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
    }
    .doc h1 { margin: 0 0 14px; font-size: clamp(1.6rem, 2.6vw, 2.1rem); line-height: 1.2; text-wrap: balance; }
    .doc h2 { margin: 2.2em 0 .6em; padding-top: .6em; border-top: 1px solid var(--line); font-size: 1.4rem; line-height: 1.25; text-wrap: balance; }
    .doc h3 { margin: 1.6em 0 .4em; font-size: 1.12rem; line-height: 1.3; }
    .doc h4 { margin: 1.3em 0 .3em; font-size: 1rem; color: var(--accent); }
    .doc p, .doc ul, .doc ol { margin: 0 0 .9em; }
    .doc li + li { margin-top: .25em; }
    .doc li > ul, .doc li > ol { margin: .3em 0 0; }
    .doc img {
      display: block; max-width: 100%; max-height: 460px; width: auto; height: auto; margin: 10px 0 18px;
      border: 1px solid var(--line); border-radius: 8px; cursor: zoom-in;
    }
    .doc code {
      padding: 1px 5px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface-soft);
      font-family: "Cascadia Mono", "SFMono-Regular", Consolas, monospace; font-size: .88em;
    }
    .doc pre { overflow-x: auto; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-soft); }
    .doc pre code { padding: 0; border: 0; background: none; }
    .doc blockquote { margin: 0 0 1em; padding: 10px 16px; border-left: 4px solid var(--note); background: #fffdf7; color: var(--text); }
    .doc blockquote p:last-child { margin-bottom: 0; }
    .doc table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; margin: 0 0 1em; font-size: .93rem; }
    .doc th, .doc td { padding: 7px 10px; border: 1px solid var(--line); text-align: left; vertical-align: top; }
    .doc th { background: var(--surface-soft); }
    .doc hr { border: 0; border-top: 1px solid var(--line); margin: 2em 0; }
    .doc .anchor { margin-left: 6px; color: var(--line-strong); text-decoration: none; font-weight: 400; opacity: 0; }
    .doc h2:hover .anchor, .doc h3:hover .anchor { opacity: 1; }
    .status { padding: 40px 0; color: var(--muted); }

    .to-top {
      position: fixed; right: 18px; bottom: 18px; padding: 8px 12px; border: 1px solid var(--line-strong);
      border-radius: 999px; background: var(--surface); color: var(--accent); font-size: .88rem; text-decoration: none;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    .lightbox { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px; background: rgba(20, 29, 33, .82); cursor: zoom-out; }
    .lightbox[hidden] { display: none; }
    .lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; background: #fff; }

    footer { padding: 20px 0 36px; border-top: 1px solid var(--line); color: var(--quiet); font-size: .9rem; }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; gap: 14px; padding-top: 14px; }
      .toc { display: none; }
      .toc-mobile { display: block; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 8px 12px; font-size: .92rem; }
      .toc-mobile summary { cursor: pointer; font-weight: 600; color: var(--accent); }
      .toc-mobile ol { list-style: none; margin: 8px 0 0; padding: 0; max-height: 60vh; overflow: auto; }
      .toc-mobile a { display: block; padding: 3px 0; color: var(--muted); text-decoration: none; }
      .toc-mobile .lvl3 a { padding-left: 14px; font-size: .88rem; }
      article.doc { padding: 20px 18px 28px; }
      .doc-switch { margin-left: 0; }
      .topbar { position: static; }
      html { scroll-padding-top: 12px; }
      .doc-actions a { padding: 4px 10px; font-size: .85rem; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="page bar">
      <a class="brand" href="./"><span class="brand-mark" aria-hidden="true">CG</span><span>COOL-Grades</span></a>
      <nav class="doc-switch" aria-label="Dokumente" id="docSwitch"></nav>
    </div>
  </header>

  <div class="page layout">
    <aside class="toc" aria-label="Inhaltsverzeichnis"><h2>Inhalt</h2><ol id="toc"></ol></aside>
    <main>
      <details class="toc-mobile"><summary>Inhaltsverzeichnis</summary><ol id="tocMobile"></ol></details>
      <div class="doc-actions" id="docActions"></div>
      <article class="doc" id="doc"><p class="status">Dokument wird geladen …</p></article>
    </main>
  </div>

  <footer>
    <div class="page">
      COOL-Grades · <a href="./">Projektseite</a> ·
      <a href="https://github.com/chrismey-71/cool-grades">Repository</a> ·
      Darstellung mit <a href="https://github.com/markedjs/marked">marked</a> (MIT-Lizenz)
    </div>
  </footer>

  <a class="to-top" href="#top" id="toTop" hidden>↑ nach oben</a>
  <div class="lightbox" id="lightbox" hidden><img alt=""></div>

  <script src="assets/marked.umd.js"></script>
  <script>
  (function () {
    // Erlaubte Dokumente (Dateien im selben Ordner docs/). Andere Werte werden ignoriert.
    var DOCS = {
      'lehrerhandbuch': { title: 'Lehrer:innen-Handbuch', docx: 'lehrerhandbuch.docx' },
      'demoinstallation': { title: 'Demoinstallation' },
      'admin-schuljahreswechsel': { title: 'Schuljahreswechsel (Admin)' },
      'security-deployment': { title: 'Sicherheit & Betrieb' }
    };
    var params = new URLSearchParams(location.search);
    var key = params.get('doc');
    if (!DOCS[key]) key = 'lehrerhandbuch';
    var meta = DOCS[key];

    document.title = meta.title + ' | COOL-Grades';
    document.getElementById('docSwitch').innerHTML = Object.keys(DOCS).map(function (k) {
      return '<a href="handbuch.html?doc=' + k + '"' + (k === key ? ' aria-current="page"' : '') + '>' + DOCS[k].title + '</a>';
    }).join('');
    var actions = '<a href="' + key + '.md">Markdown-Quelle</a>';
    if (meta.docx) actions += '<a href="' + meta.docx + '">Als Word-Dokument herunterladen</a>';
    actions += '<a href="https://github.com/chrismey-71/cool-grades/blob/main/docs/' + key + '.md">Auf GitHub ansehen</a>';
    document.getElementById('docActions').innerHTML = actions;

    function slugify(text, used) {
      var s = text.toLowerCase()
        .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
        .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'abschnitt';
      var base = s, n = 2;
      while (used[s]) { s = base + '-' + n++; }
      used[s] = true;
      return s;
    }

    var docEl = document.getElementById('doc');
    fetch(key + '.md', { cache: 'no-cache' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(function (md) {
        docEl.innerHTML = marked.parse(md, { gfm: true });
        var used = {}, items = [];
        docEl.querySelectorAll('h1, h2, h3').forEach(function (h) {
          var id = slugify(h.textContent, used);
          h.id = id;
          if (h.tagName !== 'H1') {
            var a = document.createElement('a');
            a.className = 'anchor'; a.href = '#' + id; a.textContent = '#'; a.setAttribute('aria-label', 'Link zu diesem Abschnitt');
            h.appendChild(a);
            items.push({ id: id, text: h.textContent.replace(/#$/, ''), lvl: h.tagName === 'H2' ? 2 : 3 });
          }
        });
        var tocHtml = items.map(function (i) {
          return '<li class="lvl' + i.lvl + '"><a href="#' + i.id + '">' + i.text.replace(/</g, '&lt;') + '</a></li>';
        }).join('');
        document.getElementById('toc').innerHTML = tocHtml;
        document.getElementById('tocMobile').innerHTML = tocHtml;

        // Links auf andere Dokumente dieser Seite in die formatierte Ansicht umleiten
        docEl.querySelectorAll('a[href$=".md"]').forEach(function (a) {
          var m = /^(?:\.\/)?([a-z0-9-]+)\.md$/.exec(a.getAttribute('href'));
          if (m && DOCS[m[1]]) a.href = 'handbuch.html?doc=' + m[1];
        });
        docEl.querySelectorAll('img').forEach(function (img) { img.loading = 'lazy'; });

        // Aktiven Abschnitt im Inhaltsverzeichnis markieren
        var links = {}, tocBox = document.querySelector('.toc');
        document.querySelectorAll('#toc a').forEach(function (a) { links[a.getAttribute('href').slice(1)] = a; });
        if ('IntersectionObserver' in window) {
          var obs = new IntersectionObserver(function (entries) {
            entries.forEach(function (e) {
              if (!e.isIntersecting) return;
              Object.keys(links).forEach(function (k) { links[k].classList.remove('is-active'); });
              var l = links[e.target.id];
              if (l) {
                l.classList.add('is-active');
                // nur das Inhaltsverzeichnis selbst mitscrollen, nicht die Seite
                var box = tocBox.getBoundingClientRect(), r = l.getBoundingClientRect();
                if (r.top < box.top || r.bottom > box.bottom) tocBox.scrollTop += r.top - box.top - box.height / 3;
              }
            });
          }, { rootMargin: '-80px 0px -70% 0px' });
          items.forEach(function (i) { obs.observe(document.getElementById(i.id)); });
        }
        if (location.hash) {
          var target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
          if (target) target.scrollIntoView();
        }
      })
      .catch(function () {
        docEl.innerHTML = '<p class="status">Das Dokument konnte nicht geladen werden. <a href="' + key + '.md">Markdown-Datei direkt öffnen</a></p>';
      });

    // Bilder vergrößern
    var lb = document.getElementById('lightbox'), lbImg = lb.querySelector('img');
    docEl.addEventListener('click', function (e) {
      if (e.target.tagName !== 'IMG') return;
      lbImg.src = e.target.src; lbImg.alt = e.target.alt; lb.hidden = false;
    });
    lb.addEventListener('click', function () { lb.hidden = true; lbImg.src = ''; });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { lb.hidden = true; lbImg.src = ''; } });

    var toTop = document.getElementById('toTop');
    document.body.id = 'top';
    window.addEventListener('scroll', function () { toTop.hidden = window.scrollY < 600; }, { passive: true });
  })();
  </script>
</body>
</html>
